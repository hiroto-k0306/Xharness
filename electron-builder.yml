# DESIGN.md §17.2。exe の作成は手元(Windows)で行う: docs/phase2-local-check.md
appId: local.xharness.app
productName: XHarness
beforePack: ./scripts/prepare-sdk-runtime.mjs
copyright: XHarness
directories:
  output: dist
  buildResources: resources
# ビルド済みの out/ だけを入れる(src・テスト・資格情報の置き場所は含めない)
files:
  - out/**
  - package.json
  - catalog/models.yaml
  - "!**/*.map"
# --fake 用の fixtures(実レスポンスの録画。秘密値は除去済み)を exe に同梱する
extraResources:
  - from: .out/claude-sdk-seed/node_modules
    to: claude-sdk-seed/node_modules
    filter: ["**/*"]
  - from: test/fixtures/claude
    to: fixtures
    filter:
      - phase1-haiku-text.json
      - phase1-headless-read-1.json
      - phase1-headless-read-2.json
      - phase3-web-haiku.json
  - from: test/fixtures/codex
    to: fixtures-codex
    filter:
      - x2-gpt-6-luna.json
      - x3-tool-1.json
      - x3-tool-2.json
      - x4-gpt-6-luna-max.json
      - phase3-web-live.json
win:
  target: [nsis, portable]
  icon: resources/icon.ico
  # 未署名(個人利用: §14)。SmartScreen の警告は「詳細情報 → 実行」で進める
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: XHarness-Setup-${version}.${ext}
portable:
  artifactName: XHarness-${version}-portable.${ext}
  # 26.15.3 の実装では true で $PLUGINSDIR/app(起動ごとに固有)になる。
  # 既定のビルド共通 TEMP を使うと、二重起動の終了時に先行アプリの資源が消える。
  unpackDirName: true
# 自動アップデートは v1 では行わない
publish: null
# Grep は PATH 上の ripgrep を使う(同梱しない)ため asarUnpack は不要
